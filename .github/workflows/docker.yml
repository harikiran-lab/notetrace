name: Build & Push

on:
  push:
    # Semver tags intentionally omitted. Merging to main already fires this
    # workflow and publishes :latest to both registries; a tag push would
    # fire it again with no matching tag rule (branches-only metadata),
    # producing a spurious failure. Historical versions live on the GitHub
    # Releases page with signed APKs; Docker consumers pin :latest or use
    # manifest digests.
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Docker Hub is a mirror. Its secrets aren't visible to a private repo
    # (org secrets on the free plan reach public repos only), so the mirror
    # is skipped instead of failing the whole build; GHCR always publishes.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the x86 GHA runner emulate ARM64 instructions during
      # the arm64 build leg. Needed for cross-arch builds without a
      # separate arm64 runner. Covers Raspberry Pi 4 / Pi 5.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository == 'TraceApps/notetrace' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only two image tags are published, mirrored to both registries:
      #   push to main → :latest
      #   push to dev  → :dev
      # (semver git tags no longer trigger this workflow; see the top-of-file
      # trigger comment for why.)
      # Publish GHCR images under this repository, including on forks.
      # Only upstream publishes the traceapps/notetrace Docker Hub mirror.
      #
      # Semver family tags (:1.2.3, :1.2, :1) and per-commit :sha-*
      # tags are intentionally not emitted. Registry stays uncluttered
      # and users pick one of two known-good pins: :latest for stable
      # releases (main), :dev for the leading edge. Historical release
      # artifacts live on the GitHub Releases page (source + signed APK
      # per tag); reproducibility for a specific version uses manifest
      # digests instead of a semver tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository == 'TraceApps/notetrace' && env.DOCKERHUB_USERNAME != '' && 'traceapps/notetrace' || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          trap 'docker logs notetrace-smoke; docker rm -f notetrace-smoke' EXIT
          docker run --detach --name notetrace-smoke --publish 127.0.0.1:3004:3004 "$IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            --retry-max-time 90 http://127.0.0.1:3004/api/health --output /tmp/notetrace-health.json
          node -e 'const health = JSON.parse(require("fs").readFileSync("/tmp/notetrace-health.json")); if (health.ok !== true) process.exit(1);'
          curl --fail --silent --show-error http://127.0.0.1:3004/ --output /tmp/notetrace-index.html
          grep -qi '<html' /tmp/notetrace-index.html
